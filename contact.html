<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - SalaryNest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #07111f, #0b1728, #07111f);
            color: #e5e7eb;
            line-height: 1.7;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            background: rgba(15, 27, 48, 0.96);
            border: 1px solid rgba(0, 255, 180, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            padding-bottom: 25px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            color: #ffffff;
        }

        .header p {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 16px;
        }

        .intro {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .form-card {
            padding: 25px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #1e293b;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input:focus,
        textarea:focus {
            border-color: #10d89a;
            box-shadow: 0 0 0 2px rgba(16,216,154,0.1);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #08a879;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #07956c;
        }

        .email-card {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: rgba(16,216,154,0.06);
            border: 1px solid rgba(16,216,154,0.12);
            border-radius: 14px;
        }

        .email-card h3 {
            margin: 0 0 8px;
            color: #ffffff;
        }

        .email-card p {
            margin: 0;
            color: #94a3b8;
        }

        .email {
            color: #10d89a;
            font-weight: 600;
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 0;
                padding: 25px 18px;
                border-radius: 0;
            }

            .header h1 {
                font-size: 28px;
            }

            .form-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Contact Support &amp; Feedback</h1>
        <p>SalaryNest Official Policies</p>
    </div>

    <p class="intro">
        Have a question, feature request, or found a calculation bug?
        Send a message directly to our support team.
    </p>

    <div class="form-card">

        <form id="supportForm">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                placeholder="e.g. Aman Ali"
                required
            >

            <label for="email">Your Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="e.g. worker@example.com"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                value="Support Inquiry - SalaryNest"
                required
            >

            <label for="message">Message / Question</label>
            <textarea
                id="message"
                placeholder="Explain how we can help you..."
                required
            ></textarea>

            <button type="submit">
                ✈ Send Message to Support
            </button>

        </form>

    </div>

    <div class="email-card">
        <h3>Need Direct Email Address?</h3>
        <p>
            Contact us directly at:
            <br>
            <span class="email">aman35ali786@gmail.com</span>
        </p>
    </div>

    <div class="footer">
        © 2026 SalaryNest. All rights reserved.
    </div>

</div>

<script>
    document.getElementById("supportForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const subject = document.getElementById("subject").value;
        const message = document.getElementById("message").value;

        const supportEmail = "aman35ali786@gmail.com";

        const body =
            "Name: " + name + "\n" +
            "Email: " + email + "\n\n" +
            "Message:\n" + message;

        window.location.href =
            "mailto:" + supportEmail +
            "?subject=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);
    });
</script>

</body>
</html>
